spring.application.name=minecraft-servers-controller

# The Kubernetes client is blocking: virtual threads make that cheap.
spring.threads.virtual.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

it.lorisdemicheli.minecraft-servers.namespace=minecraft-servers
it.lorisdemicheli.minecraft-servers.base-domain=example-site.it
it.lorisdemicheli.minecraft-servers.cors-allowed-origins=http://localhost:4200

# Shared data volume: a plain folder in local development, the mounted PVC in the cluster.
it.lorisdemicheli.minecraft-servers.storage.data-dir=./data
it.lorisdemicheli.minecraft-servers.storage.claim-name=minecraft-servers-data
it.lorisdemicheli.minecraft-servers.storage.trash-retention-hours=24
it.lorisdemicheli.minecraft-servers.storage.min-free-gb=2

it.lorisdemicheli.minecraft-servers.security.username=admin
it.lorisdemicheli.minecraft-servers.security.jwt-expiration-ms=86400000
# REQUIRED (no defaults, the app refuses to start without them):
#   it.lorisdemicheli.minecraft-servers.security.password
#   it.lorisdemicheli.minecraft-servers.security.jwt-secret   (at least 32 characters)
