{{- if .Values.rbac.create }}
{{- $fullname := include "minecraft-controller.fullname" . -}}
{{- $serversNs := include "minecraft-controller.serversNamespace" . -}}
# Controller: manages server StatefulSets/Services, runs commands in server pods, reads metrics.
# Namespaced Role only: no cluster-wide permission. Files and logs are read from the shared
# volume, so no PVC, pod creation or pods/log permissions are needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-controller
  namespace: {{ $serversNs }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update"]
  # get/list: adoption and cleanup of Services left by interrupted operations
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  # get: a deleted server's data is trashed only once its pod is gone; delete: terminate
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-controller
  namespace: {{ $serversNs }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "minecraft-controller.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-controller
  apiGroup: rbac.authorization.k8s.io
---
# Router: discovers server Services (and, with autoScale, scales their StatefulSets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-router
  namespace: {{ $serversNs }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  {{- if or .Values.router.autoScale.up .Values.router.autoScale.down }}
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-router
  namespace: {{ $serversNs }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "minecraft-controller.routerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-router
  apiGroup: rbac.authorization.k8s.io
{{- end }}
