{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "minecraft-controller.controllerServiceAccount" . }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "minecraft-controller.routerServiceAccount" . }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
