{{- if not .Values.auth.existingSecret }}
{{- $name := include "minecraft-controller.secretName" . -}}
{{- /* Credentials are generated once and then re-read from the cluster on upgrades. */ -}}
{{- $password := randAlphaNum 24 -}}
{{- $jwt := randAlphaNum 64 -}}
{{- $curse := .Values.auth.curseForgeApiKey -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
  {{- $data := .data | default dict -}}
  {{- with (get $data "password") }}{{ $password = . | b64dec }}{{ end -}}
  {{- with (get $data "jwt-secret") }}{{ $jwt = . | b64dec }}{{ end -}}
  {{- if not $curse }}{{- with (get $data "curseforge-api-key") }}{{ $curse = . | b64dec }}{{ end -}}{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  jwt-secret: {{ $jwt | b64enc | quote }}
  {{- if $curse }}
  curseforge-api-key: {{ $curse | b64enc | quote }}
  {{- end }}
{{- end }}
