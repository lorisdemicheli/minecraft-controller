{{- if .Values.ingress.enabled }}
{{- $fullname := include "minecraft-controller.fullname" . -}}
{{- $defaultTls := default (printf "%s-tls" $fullname) .Values.ingress.tls.secretName -}}
{{- if .Values.frontend.enabled }}
{{- $host := include "minecraft-controller.consoleHost" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- $annotations := merge (dict) .Values.ingress.console.annotations .Values.ingress.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ default $defaultTls .Values.ingress.console.tlsSecretName }}
      hosts:
        - {{ $host }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-console
                port:
                  number: 80
---
{{- end }}
{{- $apiHost := include "minecraft-controller.apiHost" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "minecraft-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- $annotations := merge (dict) .Values.ingress.api.annotations .Values.ingress.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ default $defaultTls .Values.ingress.api.tlsSecretName }}
      hosts:
        - {{ $apiHost }}
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-controller
                port:
                  name: http
{{- end }}
