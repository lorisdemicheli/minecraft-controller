# -- [REQUIRED] Base domain of the platform (e.g. example.com).
# The console is served on console.<baseDomain>, the API on api.<baseDomain>
# and every Minecraft server on <server-name>.<baseDomain>.
# The installation fails if this is left empty.
baseDomain: "mc.lorisdemicheli.it"

nameOverride: ""
fullnameOverride: ""

# -- Pull secrets for the images below.
imagePullSecrets:
  - name: regcred   # created by install.sh (private Docker Hub repo)

storage:
  # -- Size of the ONE volume shared by all servers (each gets its own folder).
  # Longhorn keeps several replicas, so it uses size x replicas on the nodes' disks.
  size: 50Gi
  # -- StorageClass. Empty = the cluster default.
  className: longhorn
  # -- ReadWriteMany lets servers run on any node (needs an RWX-capable class, e.g. Longhorn
  # with the NFSv4 client installed on every node). ReadWriteOnce only works if every pod
  # (controller and servers) ends up on the same node.
  accessMode: ReadWriteMany
  # -- Use an existing PVC (in the release namespace) instead of creating one.
  existingClaim: ""
  # -- UID/GID the controller and the server processes run as (itzg default: 1000).
  uid: 1000
  gid: 1000
  # -- chown the volume root to uid:gid before the controller starts.
  initPermissions: true
  initImage: busybox:1.37
  # -- Deleted servers stay in <volume>/.trash for this long (hours) before being purged.
  trashRetentionHours: 24
  # -- Creating a server is refused when the volume has less free space than this.
  minFreeGb: 2

auth:
  # -- Username of the single admin account.
  username: admin
  # -- Use an existing Secret instead of generating one.
  # Required keys: `password`, `jwt-secret`. Optional key: `curseforge-api-key`.
  # Recommended with GitOps (Argo CD, Flux, `helm template`): the auto-generated
  # credentials rely on `lookup`, which returns nothing in those flows and would
  # rotate the password on every render.
  existingSecret: ""
  # -- JWT lifetime in milliseconds (default 24h).
  jwtExpirationMs: 86400000
  # -- CurseForge API key, needed only for CurseForge modpacks.
  # Ignored when existingSecret is set.
  curseForgeApiKey: ""

rbac:
  # -- Create Roles/RoleBindings for the controller and the router.
  create: true

# Backend (Spring Boot, port 8080)
controller:
  image:
    repository: lorisdemicheli/minecraft-controller
    tag: dev
    pullPolicy: Always
  replicas: 1
  port: 8080
  resources: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Web console (Angular SSR / Node, port 4000).
# NOTE: the API URL is compiled into the bundle (src/environments/*.ts);
# the image must be built with apiBasePath = http://api.<baseDomain>.
frontend:
  enabled: false   # no console image yet
  image:
    repository: lorisdemicheli/minecraft-console
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 4000
  resources: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# itzg/mc-router: routes <server>.<baseDomain> to the right server Service,
# discovered through the `mc-router.itzg.me/externalServerName` annotation
# that the controller puts on each server Service.
router:
  image:
    repository: itzg/mc-router
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  autoScale:
    # -- Start a stopped server (replicas 0 -> 1) when a player connects.
    up: false
    # -- Stop a server (replicas 1 -> 0) when it is empty.
    down: false
  service:
    type: LoadBalancer
    port: 25565
    # -- Fixed nodePort (only for NodePort / LoadBalancer types).
    nodePort: null
    # -- Set to `Local` to preserve client source IPs.
    externalTrafficPolicy: ""
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: traefik   # k3s default; use "nginx" if you installed ingress-nginx
  # -- Extra annotations for both Ingresses (e.g. cert-manager issuer).
  annotations: {}
  tls:
    enabled: false
    # -- Secret holding the certificate. Empty = <fullname>-tls
    # (a wildcard cert or cert-manager must provide it).
    secretName: ""
  api:
    # -- Extra annotations only for the API Ingress. Defaults are the ingress-nginx
    # settings needed for SSE (console/log streams) and large file uploads.
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "1g"
